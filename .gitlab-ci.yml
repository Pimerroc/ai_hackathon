# GitLab shared runners are not available for this project (no active runners).
# Keep the config ready for #1, but do not create failing pipelines until a runner is enabled.
workflow:
  rules:
    - when: never

stages:
  - validate
  - security

default:
  image: alpine:3.20
  interruptible: true

validate:repo:
  stage: validate
  script:
    - test -f AGENTS.md
    - test -f .context/README.md
    - test -f .github/workflows/mirror.yml
    - echo "Repository skeleton OK"

security:secrets:
  stage: security
  script:
    - test ! -f .env
    - |
      if grep -RInE 'glpat-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{30,}|-----BEGIN (RSA|OPENSSH|EC) PRIVATE KEY-----' \
        --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.venv .; then
        echo "Potential secret found";
        exit 1;
      fi
    - echo "No obvious secrets"
